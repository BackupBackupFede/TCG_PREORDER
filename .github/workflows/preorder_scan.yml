name: TCG Preorder Bot

permissions:
  contents: write

on:
  schedule:
    - cron: "*/30 * * * *"  # toutes les 30 min (~1450 min/mois, sous les 2000 gratuites)
  workflow_dispatch:         # bouton manuel

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run bot
        env:
          TELEGRAM_TOKEN_2:   ${{ secrets.TELEGRAM_TOKEN_2 }}
          TELEGRAM_CHAT_ID_2: ${{ secrets.TELEGRAM_CHAT_ID_2 }}
        run: python preorder_scan.py

      - name: Commit & Push si changement
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git add saved_products.json
          git diff --cached --quiet && exit 0
          git pull --rebase --autostash origin main
          git add saved_products.json
          git commit -m "update products $(date -u +'%Y-%m-%d %H:%M')"
          git push
